<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="4" />
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Book Group -->
  <g transform="translate(256, 250)">
    <!-- Left Page -->
    <path d="M -15,80 L -130,55 L -130,-70 L -15,-45 Z" fill="#f0f0f5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Right Page -->
    <path d="M 15,80 L 130,55 L 130,-70 L 15,-45 Z" fill="#e2e2e8" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Spine Center -->
    <line x1="0" y1="-46" x2="0" y2="81" stroke="#50505a" stroke-width="6" stroke-linecap="round" />

    <!-- Left Lines -->
    <line x1="-110" y1="-30" x2="-35" y2="-22" stroke="#787888" stroke-width="3" stroke-linecap="round" />
    <line x1="-110" y1="-5" x2="-35" y2="3" stroke="#787888" stroke-width="3" stroke-linecap="round" />
    <line x1="-110" y1="20" x2="-35" y2="28" stroke="#787888" stroke-width="3" stroke-linecap="round" />
    <line x1="-110" y1="45" x2="-55" y2="51" stroke="#787888" stroke-width="3" stroke-linecap="round" />

    <!-- Right Lines -->
    <line x1="35" y1="-22" x2="110" y2="-30" stroke="#888898" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="3" x2="110" y2="-5" stroke="#888898" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="28" x2="110" y2="20" stroke="#888898" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="51" x2="90" y2="45" stroke="#888898" stroke-width="3" stroke-linecap="round" />

    <!-- Bookmark Ribbon -->
    <polygon points="-4,-45 16,-45 16,110 6,96 -4,110" fill="#ffffff" filter="url(#glow)" />

    <!-- Subtle Star -->
    <g transform="translate(100, -90)">
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
